name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project (first run generates .godot/)
        run: godot --headless --path . --import || true
      # The unit tests check the rules; this checks the game. A board.gd that did not parse
      # shipped to main once with every PR green, because nothing here loaded it.
      - name: The game itself loads
        timeout-minutes: 3
        run: godot --headless --path . --script res://tools/load_check.gd

      - name: Run headless tests
        run: godot --headless --path . -s tests/run_tests.gd

      # The game engine, not the Python authoring validator, is the rule of record.
      # For every levels/*.tide: load it with the real loader, replay the declared
      # solution, prove no shorter solution exists, and check the tide budget against
      # Grid.expected_tide() -- par+5 for a channels-only level, par+6 once it carries a
      # mechanic. A par the two implementations disagree on fails the PR here
      # instead of surfacing as a player finding a shortcut at level 34.
      - name: Verify every level with the game engine
        run: godot --headless --path . --script res://tools/verify_levels.gd -- res://levels
